    <style>
        * {
            box-sizing: border-box;
            letter-spacing: normal !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Action Bar */
        .action-bar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }

        .brand-text h1 {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .brand-text p {
            font-size: 11px;
            color: #94a3b8;
            margin: 2px 0 0;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 4px 8px;
            gap: 8px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            width: 170px;
            padding: 4px 6px;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: #64748b;
            font-weight: 500;
        }

        .search-btn {
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .actions-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }

        .btn-download:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45);
        }

        .btn-print {
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-print:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .badge-verified {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            color: #34d399;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Container & Document Styling - EXACT 100% PARITY WITH try.html */
        .bill-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            gap: 30px;
            min-height: calc(100vh - 70px);
        }

        .bill-page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            padding: 20mm;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            box-sizing: border-box;
        }

        .doc-header2 {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 4px solid #4f46e5;
            padding-bottom: 16px;
            margin-bottom: 30px;
        }

        .doc-header2 .doc-logo2 {
            height: 75px;
            width: auto;
            max-width: 320px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 2px 4px rgba(79, 70, 229, 0.2));
        }

        .doc-header2 .doc-subtitle {
            margin: 6px 0 0;
            font-size: 11px;
            font-weight: 800;
            color: #4f46e5;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .doc-header2 .doc-meta2 {
            text-align: right;
        }

        .doc-header2 .meta-label {
            margin: 0;
            font-size: 9px;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .doc-header2 .meta-value {
            margin: 2px 0 0;
            font-size: 16px;
            font-weight: 900;
            color: #0f172a;
        }

        .section-label2 {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #4f46e5;
            text-transform: uppercase;
            margin: 0 0 6px;
        }

        .doc-footer3 {
            position: absolute;
            bottom: 14mm;
            left: 20mm;
            right: 20mm;
            display: flex;
            align-items: flex-start;
            gap: 22px;
            border-top: 1px solid #eef0f5;
            padding-top: 14px;
        }

        .doc-footer3 .doc-qr-box {
            text-align: center;
            flex-shrink: 0;
        }

        .doc-footer3 .doc-qr-box .qr-slot {
            padding: 4px;
            background: #fff;
            border: 1px solid #eee;
            display: inline-block;
            border-radius: 6px;
        }

        .doc-footer3 .doc-qr-box small {
            display: block;
            font-size: 8px;
            color: #94a3b8;
            font-weight: 700;
            margin-top: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .doc-footer3 .doc-cert-text {
            flex: 1;
        }

        .doc-footer3 .cert-title {
            margin: 0 0 3px;
            font-size: 9px;
            font-weight: 900;
            color: #4f46e5;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .doc-footer3 .cert-body {
            margin: 0;
            font-size: 8.5px;
            line-height: 1.45;
            color: #64748b;
            font-weight: 500;
        }

        .doc-footer3 .doc-sign2 {
            text-align: right;
            flex-shrink: 0;
        }

        .doc-footer3 .doc-sign2 strong {
            display: block;
            font-size: 12px;
            font-weight: 900;
            color: #0f172a;
            line-height: 1.2;
        }

        .doc-footer3 .doc-sign2 .sign-sub {
            display: block;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #4f46e5;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .doc-footer3 .doc-sign2 .sign-auth {
            display: block;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-top: 1px;
            text-transform: uppercase;
        }

        .ledger-row, .procedure-row {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        /* Loading & Error States */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 25, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(79, 70, 229, 0.2);
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Print Media Styles */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .no-print, .action-bar, #loading-overlay {
                display: none !important;
            }

            .bill-container {
                padding: 0 !important;
                gap: 0 !important;
            }

            .bill-page {
                box-shadow: none !important;
                margin: 0 !important;
                width: 210mm !important;
                height: 297mm !important;
                min-height: 297mm !important;
                max-height: 297mm !important;
                page-break-after: always !important;
                break-after: page !important;
                box-sizing: border-box !important;
            }
        }

        @media (max-width: 820px) {
            .bill-page {
                width: 100% !important;
                min-height: auto !important;
                padding: 16px !important;
                box-shadow: none !important;
            }

        // Helper functions
        function toNum(v) {
            if (v === null || v === undefined) return 0;
            const n = Number(String(v).replace(/[^0-9.-]/g, ''));
            return isNaN(n) ? 0 : n;
        }

        function formatDateDMY(rawDate) {
            if (!rawDate) return '';
            const s = String(rawDate).trim();
            if (/^\d{2}-\d{2}-\d{4}$/.test(s)) return s;
            const d = new Date(s);
            if (isNaN(d.getTime())) return s;
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function getSessionTypeLabel(id) {
            const raw = String(id || '').trim().toUpperCase();
            if (raw.startsWith('PHC')) return 'In-Clinic Specialized Rehabilitation Session';
            if (raw.startsWith('POC') || raw.startsWith('PO')) return 'Home Healthcare Personalized Clinical Session';
            return 'Physiotherapy & Rehabilitation Session';
        }

        function chunkArray(arr, size) {
            if (!arr || !size) return [];
            const chunks = [];
            for (let i = 0; i < arr.length; i += size) {
                chunks.push(arr.slice(i, i + size));
            }
            return chunks;
        }

        function buildDocHeader(stmtNo, customStyle = '') {
            const styleAttr = customStyle ? ` style="${customStyle}"` : '';
            return `<div class="doc-header2"${styleAttr}>

                <div class="doc-meta2">
                    <p class="meta-label">Statement No.</p>
                    <p class="meta-value editable">${stmtNo}</p>
                </div>
            </div>`;
        }

        function buildPageFooter(qrId, docName, verifyUrl) {
            return `<div class="doc-footer3">
                <div class="doc-qr-box">
                    <div id="${qrId}" class="qr-slot" data-verify-url="${encodeURIComponent(verifyUrl)}" style="width:80px;height:80px;background:#fff;border:1px solid #eee;border-radius:6px;padding:2px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;"></div>

                    <p class="cert-body editable">System-generated medical statement issued by Prism Physiotherapy &amp; Rehabilitation Center. Digitally authenticated and valid without physical signature. Verification link embedded in the QR code.</p>
                </div>
                <div class="doc-sign2">
                    <strong class="editable">${docName}</strong>
                    <span class="sign-sub">DIGITAL SIGNATURE</span>
                    <span class="sign-auth">AUTHORIZED SIGNATORY</span>
                </div>
            </div>`;
        }

        function renderQRCodes(scopeEl) {
            const root = scopeEl || document;
            root.querySelectorAll('.qr-slot').forEach(slot => {
                const url = decodeURIComponent(slot.getAttribute('data-verify-url') || '');
                if (!url) return;
                slot.innerHTML = '';
                try {
                    if (typeof QRCode !== 'undefined') {
                        new QRCode(slot, {
                            text: url,
                            width: 74,
                            height: 74,
                            colorDark: '#000000',
                            colorLight: '#ffffff',
                            correctLevel: QRCode.CorrectLevel.M
                        });
                        const img = slot.querySelector('img');
                        if (img) {
                            img.style.display = 'block';
                            img.style.width = '74px';
                            img.style.height = '74px';
                            img.style.margin = '0 auto';
                        }
                        return;
                    }
                } catch(e) {
                    console.error('Local QRCode generation error:', e);
                }
                const img = document.createElement('img');
                img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=' + encodeURIComponent(url);
                img.style.width = '74px';
                img.style.height = '74px';
                img.style.display = 'block';
                slot.appendChild(img);
            });
        }

        async function fetchDatabaseBill(targetBillNo) {
            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex';

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({

                        clientToken: 'PRISM_SECURE_TOKEN_2026_9xK2',
                        caller: 'admin',
                        username: 'admin'
                    })
                });

                const result = await res.json();
                if (!result || (!result.adminData && !result.bills)) {
                    throw new Error("Unable to retrieve statement data from backend.");
                }

                renderDynamicBill(result, targetBillNo);
            } catch (err) {
                console.error("Database fetch error:", err);
                overlay.innerHTML = `
                    <div style="background: #ffffff; border-radius: 20px; padding: 36px 30px; max-width: 440px; width: 90%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); color: #0f172a;">

                        <div style="display: flex; gap: 10px;">

                            <button onclick="fetchDatabaseBill(document.getElementById('retry-input').value.trim())" style="background: #4f46e5; color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer;">Search</button>

        function renderDynamicBill(db, stmt) {
            const rawStmt = String(stmt || '').trim();
            const parts = rawStmt.split('/');
            const targetPid = parts.length >= 2 ? `${parts[0]}/${parts[1]}`.toUpperCase() : rawStmt.toUpperCase();

            const bills = db.bills || [];
            const adminRows = db.adminData || [];
            const transactions = db.transactions || [];
            const doctorsList = db.doctorsList || [];

            // 1. Search in bills (Bill_Records)
            let bMatch = bills.find(b => {
                const col0 = String(b[0] || '').trim().toUpperCase();
                const col1 = String(b[1] || '').trim().toUpperCase();
                return col0 === rawStmt.toUpperCase() || col1 === rawStmt.toUpperCase();
            });

            if (!bMatch) {
                bMatch = bills.find(b => {
                    const col1 = String(b[1] || '').trim().toUpperCase();
                    const col2 = String(b[2] || '').trim().toUpperCase();
                    return col1.includes(targetPid) || col2.includes(targetPid);
                });
            }

            // 2. Search in transactions (Transaction_History)
            const txMatch = transactions.find(t => String(t[11] || '').trim().toUpperCase() === rawStmt.toUpperCase());

            // 3. Search in adminData (Database)
            const pRows = adminRows.filter(r => {
                const id = String(r[1] || '').trim().toUpperCase();
                return id === targetPid || id.includes(targetPid);
            });

            if (pRows.length === 0 && !bMatch && !txMatch) {
                throw new Error("No clinical records found for: " + rawStmt);
            }

            // Extract patient information
            let pName = '';
            let pAge = '';
            let pGender = '';
            let pAddr = '';
            let pDiag = '';
            let pDoctor = '';
            let pPhone = '';
            let pBaseRate = 300;
            let pAdvance = 0;
            let pPurchased = 0;
            let pWalletBalance = 0;
            let pDiscount = 0;

            if (bMatch) {
                pName = String(bMatch[3] || '').trim();
                pDoctor = String(bMatch[4] || '').trim();
            }
            if (txMatch) {
                if (!pName) pName = String(txMatch[2] || '').trim();
                if (!pDoctor) pDoctor = String(txMatch[3] || '').trim();
            }

            pRows.forEach(r => {
                if (!pName && r[2]) pName = String(r[2]).trim();
                if (!pAge && r[3]) pAge = String(r[3]).trim();
                if (!pGender && r[4]) pGender = String(r[4]).trim();
                if (!pPhone && r[5]) pPhone = String(r[5]).trim();
                if (!pDiag && r[6]) pDiag = String(r[6]).trim();
                if (!pDoctor && r[10]) pDoctor = String(r[10]).trim();
                if (r[14]) pAddr = String(r[14]).trim();
                if (r[9] && toNum(r[9]) > 0 && !pBaseRate) pBaseRate = toNum(r[9]);
            });

            // Doctor Details & Reg No
            const docName = pDoctor || 'Dr Ravi Kumar (PT)';
            let docReg = '1045';
            const matchedDoc = doctorsList.find(d => {
                const dName = String(d[0] || '').toLowerCase();
                return docName.toLowerCase().includes(dName) || dName.includes(docName.toLowerCase());
            });
            if (matchedDoc && matchedDoc[1]) {
                docReg = String(matchedDoc[1]).trim();
            }

            // Prefix formatting
            const hasExistingPrefix = /^(mr|mrs|ms|miss|dr)\.?\s+/i.test(pName.trim());
            const prefix = hasExistingPrefix ? '' : ((pGender === 'Male') ? 'Mr. ' : 'Ms. ');

            // Session Logs
            let sessionLogs = pRows.filter(r => {
                const type = String(r[7] || '').trim().toLowerCase();
                return type !== 'case closed' && type !== 'bill issued';
            });

            sessionLogs.sort((a, b) => new Date(a[8] || a[0]) - new Date(b[8] || b[0]));

            let numSessions = sessionLogs.length;
            if (bMatch && Number(bMatch[5])) {
                numSessions = Number(bMatch[5]);
            }
            if (sessionLogs.length > numSessions && numSessions > 0) {
                sessionLogs = sessionLogs.slice(0, numSessions);
            }

            // Bill Date
            let dateStr = '';
            if (bMatch && bMatch[0]) dateStr = formatDateDMY(bMatch[0]);
            else if (txMatch && txMatch[0]) dateStr = formatDateDMY(txMatch[0]);
            else if (sessionLogs.length > 0) dateStr = formatDateDMY(sessionLogs[sessionLogs.length - 1][8]);
            else {
                const now = new Date();
                dateStr = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()}`;
            }

            // Financial Calculations
            let totalPayable = 0;
            sessionLogs.forEach(l => {
                totalPayable += toNum(l[9]);
            });
            if (totalPayable === 0) {
                totalPayable = (bMatch && toNum(bMatch[6])) ? toNum(bMatch[6]) : (numSessions * 300 || 300);
            }

            let amountPaid = totalPayable;
            let amountDue = 0;

            if (bMatch && bMatch.length >= 9 && !isNaN(Number(bMatch[7]))) {
                totalPayable = toNum(bMatch[6]) || totalPayable;
                amountPaid = toNum(bMatch[7]);
                amountDue = toNum(bMatch[8]) || 0;
            } else if (txMatch) {
                amountPaid = toNum(txMatch[6]) || totalPayable;
                amountDue = Math.max(0, totalPayable - amountPaid);
            }

            // Resolved Statement Number
            const finalStmtNo = (bMatch && (bMatch[1] || bMatch[0])) ? (bMatch[1] || bMatch[0]) : rawStmt;
            const verifyUrl = `https://prismhealthcare.in/verify.html?billNo=${encodeURIComponent(finalStmtNo)}`;

            const billContext = {
                stmtNo: finalStmtNo,
                prefix: prefix,
                name: pName || 'Patient',
                id: targetPid,
                gender: pGender,
                age: pAge,
                address: pAddr,
                diag: pDiag || 'Physiotherapy Rehabilitation',
                docName: docName,
                docReg: docReg,
                docPhone: '+91 97080 59081',
                docWeb: 'Prismhealthcare.in',
                docUdyam: 'UDYAM-BR-06-0028454',
                dateStr: dateStr,
                fromDate: sessionLogs.length > 0 ? sessionLogs[0][8] : '',
                toDate: sessionLogs.length > 0 ? sessionLogs[sessionLogs.length - 1][8] : '',
                logs: sessionLogs,
                baseRate: pBaseRate,
                discountAmount: pDiscount,
                totalPayable: totalPayable,
                amountPaid: amountPaid,
                amountDue: amountDue,
                advance: pAdvance,
                purchased: pPurchased,
                walletBalance: pWalletBalance,
                includeLedger: sessionLogs.length > 0,
                includeCert: true,
                verifyUrl: verifyUrl
            };

            currentBillContext = billContext;

            // Generate HTML & Render QR
            const container = document.getElementById('bill-content-pages');
            container.innerHTML = buildCompleteBillPagesHtml(billContext);
            renderQRCodes(container);

            document.getElementById('loading-overlay').style.display = 'none';
            document.getElementById('bill-input').value = finalStmtNo;

            if (window.lucide) lucide.createIcons();
        }

        function lookupBillFromInput() {
            const inputVal = document.getElementById('bill-input').value.trim();
            if (!inputVal) {
                alert('Please enter a Statement or Bill Number');
                return;
            }
            fetchDatabaseBill(inputVal);
        }

        // PDF Generation - EXACT ENGINE WITH try.html
        async function downloadBillPDF() {
            if (!currentBillContext) {
                alert('No bill loaded to download.');
                return;
            }
            const { name, stmtNo } = currentBillContext;
            const container = document.getElementById('bill-content-pages');
            const pageEls = container ? Array.from(container.querySelectorAll('.bill-page')) : [];
            if (!pageEls.length || typeof html2canvas === 'undefined' || !window.jspdf) {
                alert('PDF engine not ready. Please try again.');
                return;
            }

            const downloadBtn = document.querySelector('.btn-download');
            const origHtml = downloadBtn ? downloadBtn.innerHTML : '';
            if (downloadBtn) {
                downloadBtn.disabled = true;
                downloadBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Preparing PDF...`;
                if (window.lucide) lucide.createIcons();
            }

            let iframe = null;
            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    unit: 'mm',
                    format: 'a4',
                    orientation: 'portrait',
                    compress: true
                });
                const pageWidthMM = 210, pageHeightMM = 297;

                const imgDataMap = new Map();
                container.querySelectorAll('img').forEach(img => {
                    if (img.src && !imgDataMap.has(img.src)) {
                        if (img.src.startsWith('data:')) {
                            imgDataMap.set(img.src, img.src);
                            return;
                        }
                        try {
                            if (img.complete && img.naturalWidth > 0) {
                                const c = document.createElement('canvas');
                                c.width = img.naturalWidth;
                                c.height = img.naturalHeight;
                                const ctx = c.getContext('2d');
                                ctx.drawImage(img, 0, 0);
                                imgDataMap.set(img.src, c.toDataURL('image/png'));
                            }
                        } catch(e) {}
                    }
                });

                iframe = document.createElement('iframe');
                iframe.style.cssText = 'position:fixed;left:-9999px;top:0;width:794px;height:1123px;border:none;opacity:0;pointer-events:none;';
                document.body.appendChild(iframe);

                const idoc = iframe.contentDocument || iframe.contentWindow.document;
                idoc.open();
                idoc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; letter-spacing: normal !important; }
html, body { margin: 0; padding: 0; background: #ffffff; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.bill-page { width: 794px !important; min-height: 1123px !important; padding: 75px !important; box-sizing: border-box !important; position: relative !important; background: #ffffff !important; transform: none !important; zoom: 1 !important; margin: 0 !important; }
.doc-header2 { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid #4f46e5; padding-bottom: 16px; margin-bottom: 30px; }
.doc-meta2 { text-align: right; }
.meta-label { margin: 0; font-size: 9px; font-weight: 800; color: #94a3b8; }
.meta-value { margin: 2px 0 0; font-size: 16px; font-weight: 900; color: #0f172a; }
.section-label2 { font-size: 10px; font-weight: 900; color: #4f46e5; margin: 0 0 6px; }
.doc-footer3 { position: absolute; bottom: 50px; left: 75px; right: 75px; display: flex; align-items: flex-start; gap: 22px; border-top: 1px solid #eef0f5; padding-top: 14px; }
.doc-qr-box { text-align: center; flex-shrink: 0; }
.doc-qr-box .qr-slot { padding: 4px; background: #fff; border: 1px solid #eee; display: inline-block; border-radius: 6px; }
.doc-qr-box small { display: block; font-size: 8px; color: #94a3b8; margin-top: 4px; max-width: 74px; line-height: 1.3; }
.doc-cert-text { flex: 1; }
.cert-title { font-size: 10px; font-weight: 900; color: #4f46e5; margin: 0 0 4px; }
.cert-body { font-size: 9.5px; color: #64748b; line-height: 1.5; margin: 0; }
.doc-sign2 { text-align: right; flex-shrink: 0; min-width: 160px; }
.doc-sign2 strong { display: block; font-size: 12px; color: #0f172a; }
.doc-sign2 .sign-sub { display: block; font-size: 8px; color: #94a3b8; margin-top: 2px; }
.doc-sign2 .sign-auth { display: block; font-size: 9px; font-weight: 800; color: #4f46e5; margin-top: 2px; }
.ledger-row, .procedure-row, .bill-page table tr { page-break-inside: avoid; break-inside: avoid; }
</style>
</head><body><div id="render-target"></div></body></html>`);
                idoc.close();

                if (idoc.fonts && idoc.fonts.ready) {
                    try { await idoc.fonts.ready; } catch(e) {}
                }

                const renderTarget = idoc.getElementById('render-target');

                for (let i = 0; i < pageEls.length; i++) {
                    if (downloadBtn) {
                        downloadBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Saving ${i + 1}/${pageEls.length}...`;
                        if (window.lucide) lucide.createIcons();
                    }

                    let pageHtml = pageEls[i].outerHTML;
                    imgDataMap.forEach((dataUrl, rawSrc) => {
                        if (dataUrl && rawSrc) {
                            pageHtml = pageHtml.split(rawSrc).join(dataUrl);
                        }
                    });
                    renderTarget.innerHTML = pageHtml;

                    await new Promise(r => setTimeout(r, 25));

                    const elToRender = renderTarget.firstElementChild;
                    const canvas = await html2canvas(elToRender, {
                        scale: 1.8,
                        useCORS: true,
                        allowTaint: true,
                        imageTimeout: 500,
                        logging: false,
                        backgroundColor: '#ffffff'
                    });

                    const imgData = canvas.toDataURL('image/jpeg', 0.88);
                    const imgHeightMM = Math.min((canvas.height * pageWidthMM) / canvas.width, pageHeightMM);
                    if (i > 0) pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, 0, pageWidthMM, imgHeightMM, undefined, 'FAST');
                }

                if (iframe && iframe.parentNode) {
                    iframe.parentNode.removeChild(iframe);
                    iframe = null;
                }

                const safeName = (name || 'Patient').replace(/\s+/g, '_');
                const safeStmt = (stmtNo || 'Bill').replace(/\//g, '-');
                pdf.save(`${safeName}_Bill_${safeStmt}.pdf`);
            } catch (err) {
                console.error("PDF generation failed:", err);
                alert("Could not generate PDF: " + (err.message || 'Unknown error'));
            } finally {
                if (iframe && iframe.parentNode) {
                    iframe.parentNode.removeChild(iframe);
                    iframe = null;
                }
                if (downloadBtn) {
                    downloadBtn.disabled = false;
                    downloadBtn.innerHTML = origHtml;
                    if (window.lucide) lucide.createIcons();
                }
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const billParam = urlParams.get('billNo') || urlParams.get('bill') || urlParams.get('stmt') || urlParams.get('id');
            const initialBill = billParam || 'POC26/1058/1001';
            document.getElementById('bill-input').value = initialBill;
            fetchDatabaseBill(initialBill);
        });
    </script>
</body>
</html>
